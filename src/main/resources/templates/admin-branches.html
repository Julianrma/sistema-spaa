<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursales - SpaMoonBeauty Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/spamoonbeauty.css">
</head>
<body class="admin-page workspace-page">
<div th:replace="~{fragments/admin-nav :: navigation('branches')}"></div>
<main class="workspace-main catalog-workspace">
    <div class="crud-toolbar d-flex justify-content-between align-items-center" data-reveal><div><h1 class="h3 fw-bold">Sucursales</h1><p class="text-muted mb-0">Administra las sedes que aparecen en el portal y la agenda.</p></div><a href="/admin/branches" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i>Nueva sucursal</a></div>
    <div class="appointment-card crud-form" data-reveal><div class="card-body">
        <h5 class="fw-bold" th:text="${editingBranch != null ? 'Editar sucursal' : 'Agregar sucursal'}">Agregar sucursal</h5>
        <form th:action="@{/admin/branches/save}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${editingBranch != null ? editingBranch.id : ''}">
            <div class="col-md-6"><label for="branches-name" class="form-label">Nombre</label><input id="branches-name" name="name" class="form-control" required th:value="${editingBranch != null ? editingBranch.name : ''}"></div>
            <div class="col-md-6"><label for="branches-sector" class="form-label">Sector o etiqueta</label><input id="branches-sector" name="sector" class="form-control" required th:value="${editingBranch != null ? editingBranch.sector : ''}"></div>
            <div class="col-md-6"><label for="branches-address" class="form-label">Dirección</label><input id="branches-address" name="address" class="form-control" required th:value="${editingBranch != null ? editingBranch.address : ''}"></div>
            <div class="col-md-6"><label for="branches-openingHours" class="form-label">Horario</label><input id="branches-openingHours" name="openingHours" class="form-control" required th:value="${editingBranch != null ? editingBranch.openingHours : ''}"></div>
            <div class="col-md-3"><label for="branches-latitude" class="form-label">Latitud</label><input id="branches-latitude" name="latitude" type="number" step="any" class="form-control" required th:value="${editingBranch != null ? editingBranch.latitude : ''}"></div>
            <div class="col-md-3"><label for="branches-longitude" class="form-label">Longitud</label><input id="branches-longitude" name="longitude" type="number" step="any" class="form-control" required th:value="${editingBranch != null ? editingBranch.longitude : ''}"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar sucursal</button><a th:if="${editingBranch != null}" href="/admin/branches" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div></div>
    <section aria-label="Sucursales" class="catalog-grid">
        <article class="appointment-card catalog-item" th:each="branch : ${branches}">
            <div class="appointment-heading"><h2 class="h4" th:text="${branch.name}"></h2><span class="badge" th:classappend="${branch.active ? ' bg-success' : ' bg-secondary'}" th:text="${branch.active ? 'Activo' : 'Inactivo'}"></span></div>
            <p class="experience-eyebrow" th:text="${branch.sector}"></p>
            <p class="catalog-detail" th:text="${branch.address}"></p>
            <p class="catalog-detail" th:text="${branch.openingHours}"></p>
            <p class="experience-note" th:text="|Ubicación: ${branch.latitude}, ${branch.longitude}|"></p>
            <div th:replace="~{fragments/catalog-actions :: actions('/admin/branches', ${branch.id}, ${branch.active})}"></div>
        </article>
        <p class="appointment-card experience-note" th:if="${#lists.isEmpty(branches)}">Aún no hay sucursales. Agrega el primero con el formulario.</p>
    </section>
</main>
<script src="/js/spamoonbeauty-ui.js"></script>
</body>
</html>
