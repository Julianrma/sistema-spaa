<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursales - Aura Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin/dashboard"><i class="fa-solid fa-spa text-success me-2"></i>AURA ADMIN</a><a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a></div></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">Sucursales CRUD</h1><p class="text-muted mb-0">Administra las sedes que aparecen en el portal y la agenda.</p></div><a href="/admin/branches" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i>Nueva sucursal</a></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body">
        <h5 class="fw-bold" th:text="${editingBranch != null ? 'Editar sucursal' : 'Agregar sucursal'}">Agregar sucursal</h5>
        <form th:action="@{/admin/branches/save}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${editingBranch != null ? editingBranch.id : ''}">
            <div class="col-md-6"><label class="form-label">Nombre</label><input name="name" class="form-control" required th:value="${editingBranch != null ? editingBranch.name : ''}"></div>
            <div class="col-md-6"><label class="form-label">Sector o etiqueta</label><input name="sector" class="form-control" required th:value="${editingBranch != null ? editingBranch.sector : ''}"></div>
            <div class="col-md-6"><label class="form-label">Dirección</label><input name="address" class="form-control" required th:value="${editingBranch != null ? editingBranch.address : ''}"></div>
            <div class="col-md-6"><label class="form-label">Horario</label><input name="openingHours" class="form-control" required th:value="${editingBranch != null ? editingBranch.openingHours : ''}"></div>
            <div class="col-md-3"><label class="form-label">Latitud</label><input name="latitude" type="number" step="any" class="form-control" required th:value="${editingBranch != null ? editingBranch.latitude : ''}"></div>
            <div class="col-md-3"><label class="form-label">Longitud</label><input name="longitude" type="number" step="any" class="form-control" required th:value="${editingBranch != null ? editingBranch.longitude : ''}"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar en PostgreSQL</button><a th:if="${editingBranch != null}" href="/admin/branches" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Sucursal</th><th>Dirección</th><th>Horario</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody>
        <tr th:each="branch : ${branches}"><td th:text="|#${branch.id}|">#1</td><td><strong th:text="${branch.name}">Sucursal</strong><div class="small text-muted" th:text="${branch.sector}">Sector</div></td><td th:text="${branch.address}">Dirección</td><td th:text="${branch.openingHours}">Horario</td><td><span class="badge" th:classappend="${branch.active ? ' bg-success' : ' bg-secondary'}" th:text="${branch.active ? 'Activa' : 'Inactiva'}">Activa</span></td><td class="text-end text-nowrap"><a th:href="@{/admin/branches/edit(id=${branch.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></a><form th:action="@{/admin/branches/toggle}" method="post" class="d-inline"><input type="hidden" name="id" th:value="${branch.id}"><button class="btn btn-sm btn-outline-warning" type="submit"><i th:class="${branch.active ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'}"></i></button></form><form th:action="@{/admin/branches/delete}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar esta sucursal?');"><input type="hidden" name="id" th:value="${branch.id}"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="fa-solid fa-trash"></i></button></form></td></tr>
        <tr th:if="${#lists.isEmpty(branches)}"><td colspan="6" class="text-center text-muted py-4">No hay sucursales registradas.</td></tr>
    </tbody></table></div></div>
</main>
</body>
</html>
