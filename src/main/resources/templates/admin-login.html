<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo - Aura Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #164e63 100%); }
        .login-panel { max-width: 430px; border-radius: 18px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card login-panel shadow-lg border-0 w-100">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="text-success fs-1 mb-2"><i class="fa-solid fa-spa"></i></div>
            <h1 class="h3 fw-bold mb-1">Aura Admin</h1>
            <p class="text-muted mb-0">Ingresa para gestionar tu spa</p>
        </div>
        <div th:if="${error}" class="alert alert-danger py-2" role="alert" th:text="${error}"></div>
        <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">Sesión cerrada correctamente.</div>
        <form method="post" action="/admin/login">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuario</label>
                <input id="username" name="username" type="text" class="form-control form-control-lg" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold"><i class="fa-solid fa-right-to-bracket me-2"></i>Entrar al portal</button>
        </form>
        <a href="/" class="btn btn-link text-muted w-100 mt-3">Volver al sitio público</a>
    </div>
</main>
</body>
</html>
