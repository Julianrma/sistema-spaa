<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas y turnos - Aura Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin/dashboard"><i class="fa-solid fa-spa text-success me-2"></i>AURA ADMIN</a><a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a></div></nav>
<main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">Citas y turnos</h1><p class="text-muted mb-0">Confirma, completa, cancela o elimina las reservas reales.</p></div><a href="/agendar" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i>Nueva cita</a></div>
<div class="card border-0 shadow-sm"><div class="card-body border-bottom"><div class="row g-2"><div class="col-md-4"><label class="form-label small fw-semibold">Filtrar por estado</label><select id="statusFilter" class="form-select" onchange="filterReservations()"><option value="">Todos</option><option>PENDIENTE</option><option>CONFIRMADA</option><option>COMPLETADA</option><option>CANCELADA</option></select></div><div class="col-md-4"><label class="form-label small fw-semibold">Filtrar por sucursal</label><select id="branchFilter" class="form-select" onchange="filterReservations()"><option value="">Todas</option><option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name}">Sucursal</option></select></div></div></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Cliente</th><th>Servicio</th><th>Sucursal</th><th>Fecha</th><th>Hora</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr class="reservation-row" th:each="reservation : ${reservations}" th:data-status="${reservation.status}" th:data-branch="${reservation.branchId}"><td th:text="|#${reservation.id}|">#1</td><td><strong th:text="${reservation.customerName}">Cliente</strong><div class="small text-muted" th:text="${reservation.customerPhone}">Teléfono</div><div class="small text-muted" th:text="${reservation.customerEmail}">Correo</div></td><td><span th:each="service : ${services}" th:if="${service.id == reservation.serviceId}" th:text="${service.name}">Servicio</span></td><td><span th:each="branch : ${branches}" th:if="${branch.id == reservation.branchId}" th:text="${branch.name}">Sucursal</span></td><td th:text="${reservation.reservationDate}">Fecha</td><td th:text="${reservation.reservationTime}">Hora</td><td><span class="badge" th:classappend="${reservation.status == 'CANCELADA' ? ' bg-danger' : (reservation.status == 'COMPLETADA' ? ' bg-info text-dark' : (reservation.status == 'CONFIRMADA' ? ' bg-success' : ' bg-warning text-dark'))}" th:text="${reservation.status}">PENDIENTE</span></td><td class="text-nowrap"><form action="/admin/reservations/status" method="post" class="d-inline"><input type="hidden" name="id" th:value="${reservation.id}"><select name="status" class="form-select form-select-sm d-inline-block" style="width: 140px" onchange="this.form.submit()"><option value="PENDIENTE" th:selected="${reservation.status == 'PENDIENTE'}">Pendiente</option><option value="CONFIRMADA" th:selected="${reservation.status == 'CONFIRMADA'}">Confirmada</option><option value="COMPLETADA" th:selected="${reservation.status == 'COMPLETADA'}">Completada</option><option value="CANCELADA" th:selected="${reservation.status == 'CANCELADA'}">Cancelada</option></select></form><form action="/admin/reservations/delete" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar esta cita?');"><input type="hidden" name="id" th:value="${reservation.id}"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="fa-solid fa-trash"></i></button></form></td></tr>
<tr th:if="${#lists.isEmpty(reservations)}"><td colspan="8" class="text-center text-muted py-5">Todavía no hay citas registradas.</td></tr>
</tbody></table></div></div></main>
<script>
function filterReservations() {
    const status = document.getElementById('statusFilter').value;
    const branch = document.getElementById('branchFilter').value;
    document.querySelectorAll('.reservation-row').forEach(function (row) {
        row.hidden = (status && row.dataset.status !== status) || (branch && row.dataset.branch !== branch);
    });
}
</script>
</body>
</html>
