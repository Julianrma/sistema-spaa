<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Turno - Aura Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .slot-btn { width: 100px; margin: 4px; font-weight: 500; }
        .stepper-header { background: #1a365d; color: white; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-spa text-success me-2"></i>AURA SPA</a>
        <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="stepper-header p-3 text-center">
                    <h4 class="fw-bold mb-1"><i class="fa-regular fa-calendar-check me-2"></i>Reserva tu Cita</h4>
                    <p class="small text-white-50 mb-0">Completa los 4 pasos para confirmar tu servicio de bienestar</p>
                </div>
                <div class="card-body p-4">
                    <form action="/reservas/confirmar" method="POST">
                        <!-- Paso 1: Selección de Sucursal -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fa-solid fa-shop text-success me-2"></i>Paso 1: Selecciona la Sucursal</label>
                            <select class="form-select form-select-lg" name="sucursalId" required>
                                <option value="" selected disabled>-- Elige la sede más conveniente --</option>
                                <option value="1">Sede Norte 1 (Kennedy - San Jorge)</option>
                                <option value="2">Sede Norte 2 (Samborondón - Km 2.5)</option>
                                <option value="3">Sede Centro (Malecón y 9 de Octubre)</option>
                                <option value="4">Sede Sur (Centenario - Rosa Borja)</option>
                            </select>
                        </div>

                        <!-- Paso 2: Selección de Servicio -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fa-solid fa-hand-holding-heart text-success me-2"></i>Paso 2: Tratamiento o Servicio</label>
                            <select class="form-select form-select-lg" name="servicioId" required>
                                <option value="" selected disabled>-- Elige el servicio deseado --</option>
                                <option value="1">Masaje Piedras Volcánicas (60 min) - $45.00</option>
                                <option value="2">Limpieza Facial Profunda (45 min) - $35.00</option>
                                <option value="3">Circuito Hidrotermal (90 min) - $60.00</option>
                                <option value="4">Descontracturante Espalda (45 min) - $30.00</option>
                            </select>
                        </div>

                        <!-- Paso 3: Fecha y Horarios Disponibles -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fa-regular fa-calendar text-success me-2"></i>Paso 3: Fecha y Turno Disponible</label>
                            <input type="date" class="form-control mb-3" name="fecha" required>
                            
                            <label class="form-label small text-muted d-block">Horarios disponibles calculados en tiempo real según disponibilidad de cabinas:</label>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-outline-success slot-btn">09:00 AM</button>
                                <button type="button" class="btn btn-outline-success slot-btn active">10:30 AM</button>
                                <button type="button" class="btn btn-secondary slot-btn disabled" title="Ocupado">12:00 PM</button>
                                <button type="button" class="btn btn-outline-success slot-btn">02:30 PM</button>
                                <button type="button" class="btn btn-outline-success slot-btn">04:00 PM</button>
                                <button type="button" class="btn btn-outline-success slot-btn">05:30 PM</button>
                                <button type="button" class="btn btn-outline-success slot-btn">07:00 PM</button>
                            </div>
                            <input type="hidden" name="horaSeleccionada" value="10:30 AM">
                        </div>

                        <!-- Paso 4: Datos del Cliente -->
                        <div class="mb-4 pt-3 border-top">
                            <label class="form-label fw-bold"><i class="fa-regular fa-user text-success me-2"></i>Paso 4: Datos de Contacto</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <input type="text" class="form-control" placeholder="Nombre completo" name="clienteNombre" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control" placeholder="Cédula de Identidad" name="clienteCedula" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="tel" class="form-control" placeholder="Teléfono de contacto" name="clienteTelefono" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="email" class="form-control" placeholder="Correo electrónico" name="clienteEmail" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                            <i class="fa-solid fa-circle-check me-2"></i>Confirmar y Agendar Turno
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
