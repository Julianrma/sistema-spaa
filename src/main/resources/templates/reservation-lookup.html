<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar reserva - SpaMoonBeauty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/spamoonbeauty.css">
</head>
<body class="public-page lookup-page">
<div th:replace="~{fragments/public-navbar :: navbar('lookup')}"></div>
<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-lg-7" data-reveal>
            <section class="card lookup-card">
                <div class="lookup-heading">
                    <h1 class="h3 fw-bold">Consultar reserva</h1>
                    <p class="text-muted">Ingresa el correo usado al reservar y tu código privado.</p>
                </div>
                <div class="card-body lookup-body">
                    <div th:if="${confirmation}" class="alert alert-success" th:text="${confirmation}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/reservas/consultar}" method="post" class="row g-3">
                        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                        <div class="col-12">
                            <label for="email" class="form-label">Correo de la reserva</label>
                            <input id="email" name="email" type="email" class="form-control" required autocomplete="email" th:value="${lookupEmail}">
                        </div>
                        <div class="col-12">
                            <label for="accessCode" class="form-label">Código privado</label>
                            <input id="accessCode" name="accessCode" type="text" class="form-control font-monospace" required autocomplete="off" th:value="${accessCode}">
                        </div>
                        <div class="col-12"><button class="btn btn-success" type="submit"><i class="fa-solid fa-magnifying-glass me-1"></i>Buscar reserva</button></div>
                    </form>

                    <div th:if="${reservation}" class="reservation-result">
                        <h2 class="h5 fw-bold">Detalle de la cita</h2>
                        <dl class="row mb-3">
                            <dt class="col-sm-4">Estado</dt><dd class="col-sm-8" th:text="${reservation.status}">PENDIENTE</dd>
                            <dt class="col-sm-4">Servicio</dt><dd class="col-sm-8" th:text="${serviceName}">Servicio</dd>
                            <dt class="col-sm-4">Sucursal</dt><dd class="col-sm-8" th:text="${branchName}">Sucursal</dd>
                            <dt class="col-sm-4">Fecha y hora</dt><dd class="col-sm-8" th:text="|${reservation.reservationDate} · ${reservation.reservationTime}|">Fecha · hora</dd>
                        </dl>
                        <form th:if="${reservation.status == 'PENDIENTE' or reservation.status == 'CONFIRMADA'}" th:action="@{/reservas/cancelar}" method="post" onsubmit="return confirm('¿Cancelar esta reserva?');">
                            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                            <input type="hidden" name="email" th:value="${lookupEmail}">
                            <input type="hidden" name="accessCode" th:value="${accessCode}">
                            <button class="btn btn-outline-danger" type="submit"><i class="fa-solid fa-ban me-1"></i>Cancelar reserva</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
<script src="/js/spamoonbeauty-ui.js"></script>
</body>
</html>
