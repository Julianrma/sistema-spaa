<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reservas · Administración · SpaMoonBeauty</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/spamoonbeauty.css">
</head>
<body class="workspace-page">
<div th:replace="~{fragments/admin-nav :: navigation('reservations')}">
</div>
<main class="container experience-shell">
<header class="experience-heading">
<p class="experience-eyebrow">Revisa antes de continuar</p>
<h1>Actualizar estado
</h1>
</header>
<div th:replace="~{fragments/reservation-summary :: summary(${appointment})}">
</div>
<section class="manage-reservation">
<div th:if="${actionValid}">
<p>Cambiarás el estado de <strong th:text="${appointment.reservation.status}">
</strong> a <strong th:text="${targetStatus}">
</strong>. El sistema volverá a comprobar que la acción siga siendo válida.</p>
<form th:action="@{/admin/reservations/status}" method="post">
<input type="hidden" name="id" th:value="${appointment.reservation.id}">
<input type="hidden" name="status" th:value="${targetStatus}">
<button type="submit" class="btn btn-primary">Confirmar cambio</button>
<a href="/admin/reservations" class="btn btn-outline-light">Volver sin cambios</a>
</form>
</div>
<div th:unless="${actionValid}" role="alert">
<p>Esta transición ya no está disponible. Revisa el estado actual de la reserva.</p>
<a href="/admin/reservations" class="btn btn-outline-light">Volver a reservas</a>
</div>
</section>
</main>
<script src="/js/spamoonbeauty-ui.js">
</script>
</body>
</html>
