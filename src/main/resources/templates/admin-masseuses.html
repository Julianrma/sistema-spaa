<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesionales - SpaMoonBeauty Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/spamoonbeauty.css">
</head>
<body class="admin-page workspace-page">
<div th:replace="~{fragments/admin-nav :: navigation('professionals')}"></div>
<main class="workspace-main catalog-workspace">
    <div class="crud-toolbar d-flex justify-content-between align-items-center" data-reveal><div><h1 class="h3 fw-bold">Profesionales</h1><p class="text-muted mb-0">Administra quién puede ser elegido en una reserva.</p></div><a href="/admin/masseuses" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i>Nuevo profesional</a></div>
    <div th:if="${param.saved}" class="alert alert-success" role="status">Profesional guardado correctamente.</div>
    <div class="appointment-card crud-form" data-reveal><div class="card-body">
        <h5 class="fw-bold" th:text="${editingMasseuse != null ? 'Editar profesional' : 'Agregar profesional'}">Agregar profesional</h5>
        <form th:action="@{/admin/masseuses/save}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${editingMasseuse != null ? editingMasseuse.id : ''}">
            <div class="col-md-6"><label for="professionals-name" class="form-label">Nombre completo</label><input id="professionals-name" name="name" class="form-control" required maxlength="120" th:value="${editingMasseuse != null ? editingMasseuse.name : ''}"></div>
            <div class="col-md-6"><label for="professionals-specialty" class="form-label">Especialidad</label><input id="professionals-specialty" name="specialty" class="form-control" required maxlength="120" placeholder="Masoterapia, facial, relajación..." th:value="${editingMasseuse != null ? editingMasseuse.specialty : ''}"></div>
            <div class="col-md-6"><label for="professionals-phone" class="form-label">Teléfono</label><input id="professionals-phone" name="phone" type="tel" class="form-control" required maxlength="30" th:value="${editingMasseuse != null ? editingMasseuse.phone : ''}"></div>
            <div class="col-md-6"><label for="professionals-email" class="form-label">Correo</label><input id="professionals-email" name="email" type="email" class="form-control" required maxlength="160" th:value="${editingMasseuse != null ? editingMasseuse.email : ''}"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar profesional</button><a th:if="${editingMasseuse != null}" href="/admin/masseuses" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div></div>
    <section aria-label="Profesionales" class="catalog-grid">
        <article class="appointment-card catalog-item" th:each="masseuse : ${masseuses}">
            <div class="appointment-heading"><h2 class="h4" th:text="${masseuse.name}"></h2><span class="badge" th:classappend="${masseuse.active ? ' bg-success' : ' bg-secondary'}" th:text="${masseuse.active ? 'Activo' : 'Inactivo'}"></span></div>
            <p class="catalog-detail" th:text="${masseuse.specialty}"></p>
            <p class="catalog-detail" th:text="${masseuse.phone}"></p>
            <p class="catalog-detail" th:text="${masseuse.email}"></p>
            <div th:replace="~{fragments/catalog-actions :: actions('/admin/masseuses', ${masseuse.id}, ${masseuse.active})}"></div>
        </article>
        <p class="appointment-card experience-note" th:if="${#lists.isEmpty(masseuses)}">Aún no hay profesionales. Agrega el primero con el formulario.</p>
    </section>
</main>
<script src="/js/spamoonbeauty-ui.js"></script>
</body>
</html>
