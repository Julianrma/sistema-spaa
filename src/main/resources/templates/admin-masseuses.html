<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masajistas - Aura Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin/dashboard"><i class="fa-solid fa-spa text-success me-2"></i>AURA ADMIN</a><a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a></div></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">Masajistas</h1><p class="text-muted mb-0">Administra quién puede ser elegido en una reserva.</p></div><a href="/admin/masseuses" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i>Nueva masajista</a></div>
    <div th:if="${param.saved}" class="alert alert-success">Masajista guardada correctamente.</div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body">
        <h5 class="fw-bold" th:text="${editingMasseuse != null ? 'Editar masajista' : 'Agregar masajista'}">Agregar masajista</h5>
        <form th:action="/admin/masseuses/save" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${editingMasseuse != null ? editingMasseuse.id : ''}">
            <div class="col-md-6"><label class="form-label">Nombre completo</label><input name="name" class="form-control" required maxlength="120" th:value="${editingMasseuse != null ? editingMasseuse.name : ''}"></div>
            <div class="col-md-6"><label class="form-label">Especialidad</label><input name="specialty" class="form-control" required maxlength="120" placeholder="Masoterapia, facial, relajación..." th:value="${editingMasseuse != null ? editingMasseuse.specialty : ''}"></div>
            <div class="col-md-6"><label class="form-label">Teléfono</label><input name="phone" type="tel" class="form-control" required maxlength="30" th:value="${editingMasseuse != null ? editingMasseuse.phone : ''}"></div>
            <div class="col-md-6"><label class="form-label">Correo</label><input name="email" type="email" class="form-control" required maxlength="160" th:value="${editingMasseuse != null ? editingMasseuse.email : ''}"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar masajista</button><a th:if="${editingMasseuse != null}" href="/admin/masseuses" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Masajista</th><th>Contacto</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody>
        <tr th:each="masseuse : ${masseuses}"><td th:text="|#${masseuse.id}|">#1</td><td><strong th:text="${masseuse.name}">Nombre</strong><div class="small text-muted" th:text="${masseuse.specialty}">Especialidad</div></td><td><div th:text="${masseuse.phone}">Teléfono</div><div class="small text-muted" th:text="${masseuse.email}">Correo</div></td><td><span class="badge" th:classappend="${masseuse.active ? ' bg-success' : ' bg-secondary'}" th:text="${masseuse.active ? 'Activa' : 'Inactiva'}">Activa</span></td><td class="text-end text-nowrap"><a th:href="@{/admin/masseuses/edit(id=${masseuse.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="fa-solid fa-pen"></i></a><form th:action="/admin/masseuses/toggle" method="post" class="d-inline"><input type="hidden" name="id" th:value="${masseuse.id}"><button class="btn btn-sm btn-outline-warning" type="submit" th:title="${masseuse.active ? 'Desactivar' : 'Activar'}"><i th:class="${masseuse.active ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'}"></i></button></form><form th:action="/admin/masseuses/delete" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar esta masajista?');"><input type="hidden" name="id" th:value="${masseuse.id}"><button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar"><i class="fa-solid fa-trash"></i></button></form></td></tr>
        <tr th:if="${#lists.isEmpty(masseuses)}"><td colspan="5" class="text-center text-muted py-4">No hay masajistas registradas.</td></tr>
    </tbody></table></div></div>
</main>
</body>
</html>
